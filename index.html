                    </div>
                </div>
            </div>);
        };

        const RestTimer = ({ accent, seconds = 90, onClose }) => {
            const [rem, setRem] = useState(seconds);
            const iv = useRef(null);
            const run = () => {
                resumeAudio(); let cur = seconds; setRem(cur); clearInterval(iv.current);
                iv.current = setInterval(() => {
                    cur -= 1;
                    if (cur <= 3 && cur > 0) beep(760, 130);
                    if (cur <= 0) { beep(1020, 540); clearInterval(iv.current); setRem(0); return; }
                    setRem(cur);
                }, 1000);
            };
            useEffect(() => { run(); return () => clearInterval(iv.current); }, []);
            const done = rem <= 0;
            return (<div className="rounded-xl p-3 flex items-center justify-between border fade-in" style={{ background: accent + '14', borderColor: accent + '55' }}>
                <span className="text-[10px] font-black uppercase tracking-widest" style={{ color: accent }}>Descanso</span>
                <div className="text-2xl font-black tabular-nums" style={{ color: done ? '#10B981' : accent }}>{done ? '¡Ya!' : fmt(rem)}</div>
                <div className="flex items-center gap-3">
                    <button onClick={run} className="tap text-slate-400 p-1"><Ic d={I.reload} s={16} /></button>
                    <button onClick={onClose} className="tap text-slate-500 font-black px-1 text-lg leading-none">✕</button>
                </div>
            </div>);
        };

        const CardioBlock = ({ ex, accent, onChange }) => {
            const c = ex.cardio || { method: 'treadmill' };
            const set = (k, v) => onChange({ ...ex, cardio: { ...c, [k]: v } });
            // Se llama como función (no como <F/>) para que el input no se vuelva a montar y pierda el foco al teclear.
            const F = (k, label) => (<div key={k} className="bg-[#0B0F19] rounded-xl px-3 py-2 border border-white/[0.06] flex-1"><label className="text-[9px] block text-slate-500 font-bold uppercase">{label}</label><input type="number" inputMode="decimal" placeholder="0" value={c[k] || ''} onChange={e => set(k, e.target.value)} className="bg-transparent w-full font-black outline-none" /></div>);
            const methods = CARDIO_OFFER.includes(c.method) ? CARDIO_OFFER : [...CARDIO_OFFER, c.method];
            const ppm = Number(c.ppm) || 0;
            return (<div className="p-4 space-y-3">
                <div className="grid grid-cols-4 gap-1.5">{methods.map(m => <button key={m} onClick={() => set('method', m)} className="py-2 rounded-lg text-[11px] font-bold tap border" style={c.method === m ? { background: accent, borderColor: accent, color: '#fff' } : { borderColor: '#ffffff14', color: '#64748b' }}>{CARDIO_METHODS[m] || m}</button>)}</div>
                {c.method === 'hiit' ? <div className="flex gap-2">{F('rounds', 'Rondas')}{F('ppm', 'Pulsaciones med.')}</div>
                : c.method === 'elliptical' ? <div className="flex gap-2">{F('time', 'Tiempo (min)')}{F('ppm', 'Pulsaciones med.')}</div>
                : <div className="flex gap-2">{F('km', 'Km')}{F('time', 'Tiempo (min)')}{F('ppm', 'Puls. med.')}</div>}
                {ppm > HR_CAP && <p className="text-[11px] font-bold rounded-xl p-2.5" style={{ color: '#FDA4AF', background: '#F43F5E1A' }}>Más de {HR_CAP} ppm. Mientras moleste el esternón o el costado, quédate en 140-150 (nada de sprints).</p>}
            </div>);
        };

        /* ---------- APP ---------- */
        const App = () => {
            const [profile, setProfile] = useState(loadProfile);
            const [history, setHistory] = useState(loadHistory);
            const [weightLog, setWeightLog] = useState(loadWeight);
            const [templates, setTemplates] = useState(loadTemplates);
            const [editDay, setEditDay] = useState('back');
            const [editList, setEditList] = useState(null);
            const [restAt, setRestAt] = useState(null);
            const [restNonce, setRestNonce] = useState(0);
            const [tab, setTab] = useState('today');
            const [date, setDate] = useState(todayStr());
            const [session, setSession] = useState({ dayType: null, pain: emptyPain(), painSet: false, notes: '', exercises: [] });
            const [toast, setToast] = useState('');
            const [expanded, setExpanded] = useState(null);
            const [adding, setAdding] = useState(false);
            const [newEx, setNewEx] = useState({ name: '', kind: 'weighted' });
            const [cardioOpen, setCardioOpen] = useState(false);
            const [painOpen, setPainOpen] = useState(false);
            const [charts, setCharts] = useState(() => { try { return (JSON.parse(localStorage.getItem('mp2_charts')) || ['pain_knee', 'latpull', 'weight']).map(k => METRIC_ALIAS[k] || k); } catch { return ['pain_knee', 'latpull', 'weight']; } });
            const [range, setRange] = useState(90);
            const [wForm, setWForm] = useState({ date: todayStr(), w: '', fat: '' });
            const [diaryView, setDiaryView] = useState('week');
            const [weekOff, setWeekOff] = useState(0);
            const [monOff, setMonOff] = useState(0);
            const [notif, setNotif] = useState(typeof Notification !== 'undefined' ? Notification.permission : 'unsupported');
            const [lastBackup, setLastBackup] = useState(() => localStorage.getItem('mp2_lastbackup') || '');
            const [hideBackupBanner, setHideBackupBanner] = useState(false);
            const fileRef = useRef(null);

            useEffect(() => localStorage.setItem('mp2_prof', JSON.stringify(profile)), [profile]);
            useEffect(() => localStorage.setItem('mp2_hist', JSON.stringify(history)), [history]);
            useEffect(() => localStorage.setItem('mp2_weight', JSON.stringify(weightLog)), [weightLog]);
            useEffect(() => localStorage.setItem('mp2_charts', JSON.stringify(charts)), [charts]);
            useEffect(() => localStorage.setItem('mp2_templates', JSON.stringify(templates)), [templates]);
            const baseFor = (t) => (Object.prototype.hasOwnProperty.call(templates, t) ? templates[t] : TEMPLATES[t]) || [];
            // ---- Editor de plantillas ----
            const startEdit = (t) => { setEditDay(t); setEditList(JSON.parse(JSON.stringify(baseFor(t)))); };
            const editUpd = (k, fn) => setEditList(l => l.map((e, i) => i === k ? fn({ ...e }) : e));
            const editMove = (k, dir) => setEditList(l => { const n = [...l]; const j = k + dir; if (j < 0 || j >= n.length) return l; [n[k], n[j]] = [n[j], n[k]]; return n; });
            const editDel = (k) => setEditList(l => l.filter((_, i) => i !== k));
            const editAdd = () => setEditList(l => [...l, { name: 'Nuevo ejercicio', kind: 'weighted', block: 'main', rest: 90, ...shapeFor('weighted') }]);
            const editKind = (k, kind) => editUpd(k, e => { const { sets, done, cardio, ...meta } = e; return { ...meta, kind, ...shapeFor(kind) }; });
            const saveEdit = () => { const clean = (editList || []).filter(e => (e.name || '').trim()); const bad = clean.filter(e => blacklisted(e.name)); if (bad.length && !confirm(`En lista negra: ${bad.map(e => `${e.name} (${blacklisted(e.name)})`).join(', ')}. ¿Guardar igualmente?`)) return; setTemplates(t => ({ ...t, [editDay]: clean })); setEditList(null); ping(`Plantilla "${DAYS[editDay].label}" guardada`); };
            const resetTemplates = () => { const a = prompt('Esto borra TODAS tus plantillas personalizadas y vuelve a la base original. Escribe RESET para confirmar:'); if (a === 'RESET') { setTemplates({}); localStorage.removeItem('mp2_templates'); setEditList(null); ping('Plantillas restablecidas a base'); } };
            const ping = (m) => { setToast(m); setTimeout(() => setToast(''), 2400); };

            const activeDates = useMemo(() => new Set([...history.map(h => h.date), ...weightLog.map(w => w.date)]), [history, weightLog]);
            const streak = useMemo(() => {
                let s = 0; const d = new Date();
                if (!activeDates.has(todayStr())) d.setDate(d.getDate() - 1);
                while (activeDates.has(dstr(d))) { s++; d.setDate(d.getDate() - 1); }
                return s;
            }, [activeDates]);

            // Recordatorio 19:30 (mejor esfuerzo: requiere app/pestaña abierta o instalada activa)
            useEffect(() => {
                const check = () => {
                    if (typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
                    const now = new Date(); const t = now.getHours() * 60 + now.getMinutes();
                    const tdy = todayStr();
                    if (t >= 19 * 60 + 30 && !activeDates.has(tdy) && localStorage.getItem('mp2_notified') !== tdy) {
                        localStorage.setItem('mp2_notified', tdy);
                        try { new Notification('Moldovan Power', { body: `No has entrenado hoy 💪 Entrena o perderás tu racha de ${streak} días.` }); } catch (e) {}
                    }
                };
                const id = setInterval(check, 60000); check();
                document.addEventListener('visibilitychange', check);
                return () => { clearInterval(id); document.removeEventListener('visibilitychange', check); };
            }, [activeDates, streak]);

            const nextAfter = (t) => { const i = ORDER.indexOf(t); return i < 0 ? ORDER[0] : ORDER[(i + 1) % ORDER.length]; };
            const suggestType = useMemo(() => history.length ? nextAfter(history[0].dayType) : ORDER[0], [history]);
            const dayType = session.dayType || suggestType;
            const theme = DAYS[dayType] || DAYS.rest;

            const lastSame = (t) => { const h = history.find(x => x.dayType === t && x.date !== date); return h ? h.exercises : null; };

            useEffect(() => {
                const saved = history.find(h => h.date === date);
                if (saved) setSession({ dayType: saved.dayType, pain: normPain(saved.pain), painSet: saved.painSet ?? true, notes: saved.notes, exercises: JSON.parse(JSON.stringify(saved.exercises)) });
                else setSession({ dayType: suggestType, pain: emptyPain(), painSet: false, notes: '', exercises: seed(suggestType, profile.oneRM, lastSame(suggestType), baseFor(suggestType)) });
            }, [date]);

            const changeDay = (t) => setSession(s => ({ ...s, dayType: t, exercises: seed(t, profile.oneRM, lastSame(t), baseFor(t)) }));
            const lastPerf = (name) => {
                const h = history.filter(x => x.date !== date).find(x => (x.exercises || []).some(e => e.name === name));
                if (!h) return null;
                const ex = h.exercises.find(e => e.name === name); if (!ex) return null;
                const ds = h.date.slice(5); // MM-DD
                if (ex.kind === 'checklist') return ex.done ? `Última ${ds}: hecho` : null;
                if (ex.kind === 'timer') { const t = (ex.sets || []).map(s => fmt(Number(s.sec) || 0)).join(' · '); return t ? `Última ${ds}: ${t}` : null; }
                if (ex.kind === 'cardio') { const c = ex.cardio || {}; const bits = [CARDIO_METHODS[c.method] || '', c.km && c.km + 'km', c.time && c.time + 'min', c.ppm && c.ppm + 'ppm', c.rounds && c.rounds + 'rnd'].filter(Boolean).join(' · '); return bits ? `Última ${ds}: ${bits}` : null; }
                // weighted / reps: agrupar por peso preservando orden de aparición
                const sets = (ex.sets || []).filter(s => (s.w !== '' && s.w !== undefined && s.w !== null) || (s.r !== '' && s.r !== undefined && s.r !== null));
                if (!sets.length) return null;
                const groups = [];
                sets.forEach(s => {
                    const hasW = s.w !== '' && s.w !== undefined && s.w !== null;
                    const wNum = parseFloat(s.w);
                    const key = hasW ? String(isNaN(wNum) ? s.w : wNum) : '__none__';
                    const label = !hasW ? '' : `${String(isNaN(wNum) ? s.w : wNum).replace('.', ',')} kg`;
                    let g = groups.find(x => x.key === key);
                    if (!g) { g = { key, label, reps: [] }; groups.push(g); }
                    g.reps.push((s.r !== '' && s.r !== undefined && s.r !== null) ? String(s.r) : '0');
                });
                const lines = groups.map(g => `${g.label ? g.label + ' · ' : ''}${g.reps.join('+')}r`);
                return `Última ${ds}:\n${lines.join('\n')}`;
            };
            const daysSinceBackup = lastBackup ? Math.floor((Date.now() - new Date(lastBackup).getTime()) / 86400000) : Infinity;
            const needBackup = daysSinceBackup >= 14;

            /* ---- Semáforo: estado de cada ejercicio según el dolor de hoy ---- */
            const zoneMax = (ex, pain) => (ex.zones || []).reduce((m, z) => Math.max(m, Number((pain || {})[z]) || 0), 0);
            const worstZone = (ex, pain) => (ex.zones || []).reduce((b, z) => ((Number((pain || {})[z]) || 0) > (Number((pain || {})[b]) || 0) ? z : b), (ex.zones || [])[0]);
            const exStatus = (ex) => {
                if (!session.painSet || !(ex.zones || []).length) return null;
                const m = zoneMax(ex, session.pain); if (m < 3) return null;
                const z = ZONE[worstZone(ex, session.pain)]?.short || '';
                if (m >= 5) return { lvl: 'red', txt: `${z} ${m}/10 → hoy sáltalo.` };
                return { lvl: 'amber', txt: `${z} ${m}/10 → ${ex.alt || 'baja un 20-30% la carga y recorta el recorrido.'}` };
            };
            /* ---- Doble progresión conservadora: subir solo con el tope de reps en todas las series y 0/10 ---- */
            const progress = (ex) => {
                if (ex.kind !== 'weighted' || !Array.isArray(ex.range)) return null;
                const h = history.filter(x => x.date < date).find(x => (x.exercises || []).some(e => e.name === ex.name));
                if (!h) return null;
                const prev = h.exercises.find(e => e.name === ex.name);
                const work = (prev.sets || []).filter(s => !isWarmSet(s) && (s.r !== '' || s.w !== ''));
                if (!work.length) return null;
                const hi = ex.range[1];
                const hit = work.every(s => (parseInt(s.r) || 0) >= hi);
                if (!hit) return { up: false, txt: `Mantén el peso hasta hacer ${hi} reps en todas las series.` };
                const painPrev = zoneMax(ex, h.pain);
                if (painPrev > 0) return { up: false, txt: `Llegaste a ${hi} reps, pero hubo molestia (${painPrev}/10). Mantén el peso.` };
                if (!session.painSet) return { up: false, txt: `Llegaste a ${hi} reps. Rellena el semáforo de hoy para saber si toca subir.` };
                const painNow = zoneMax(ex, session.pain);
                if (painNow > 0) return { up: false, txt: `Llegaste a ${hi} reps, pero hoy hay molestia (${painNow}/10). Mantén el peso.` };
                const w = Math.max(...work.map(s => parseFloat(s.w) || 0));
                const n = (v) => String(v).replace('.', ',');
                return { up: true, txt: `Toca subir: ${w ? `${n(w)} → ${n(Math.round((w + (ex.inc || 2.5)) * 2) / 2)} kg` : `+${n(ex.inc || 2.5)} kg`} (tope de reps y 0/10 durante y después).` };
            };
            const okName = (name) => { const why = blacklisted(name); return !why || confirm(`"${name}" está en tu lista negra (${why}). ¿Añadirlo igualmente?`); };

            const save = () => {
                const entry = { id: Date.now(), date, dayType, bw: profile.bw, pain: { ...session.pain }, painSet: session.painSet, notes: session.notes, exercises: JSON.parse(JSON.stringify(session.exercises)) };
                setHistory(h => [entry, ...h.filter(x => x.date !== date)].sort((a, b) => new Date(b.date) - new Date(a.date)));
                ping('Sesión guardada');
            };
            const delEntry = (id) => { if (confirm('¿Borrar esta sesión?')) setHistory(h => h.filter(x => x.id !== id)); };
            const updEx = (i, fn) => setSession(s => ({ ...s, exercises: s.exercises.map((e, k) => k === i ? fn(JSON.parse(JSON.stringify(e))) : e) }));
            const delExAt = (i) => setSession(s => ({ ...s, exercises: s.exercises.filter((_, k) => k !== i) }));
            const pushEx = (b) => setSession(s => ({ ...s, exercises: [...s.exercises, JSON.parse(JSON.stringify(b))] }));
            const addEx = () => {
                if (!newEx.name.trim() || !okName(newEx.name.trim())) return;
                const b = { name: newEx.name.trim(), kind: newEx.kind, block: newEx.kind === 'cardio' ? 'cardio' : 'main', rest: newEx.kind === 'cardio' || newEx.kind === 'checklist' ? undefined : 90 };
                if (newEx.kind === 'checklist') b.done = false;
                else if (newEx.kind === 'timer') b.sets = [{ sec: 60, done: false }];
                else if (newEx.kind === 'cardio') b.cardio = { method: 'treadmill', km: '', time: '', ppm: '', rounds: '' };
                else b.sets = [{ w: '', r: '' }];
                pushEx(b); setNewEx({ name: '', kind: 'weighted' }); setAdding(false);
            };
            const addCardio = (m) => { pushEx({ name: 'Cardio', kind: 'cardio', block: 'cardio', target: '140-150 ppm', cue: CARDIO_CUE, cardio: { method: m, km: '', time: '', ppm: '', rounds: '' } }); setCardioOpen(false); };

            const saveWeight = () => {
                if (!wForm.w) { ping('Pon al menos el peso'); return; }
                const e = { date: wForm.date, w: wForm.w, fat: wForm.fat };
                setWeightLog(l => [e, ...l.filter(x => x.date !== wForm.date)].sort((a, b) => new Date(b.date) - new Date(a.date)));
                setWForm({ date: todayStr(), w: '', fat: '' }); ping('Peso registrado');
            };
            const delWeight = (d) => setWeightLog(l => l.filter(x => x.date !== d));

            const reqNotif = () => { if (typeof Notification === 'undefined') { ping('Notificaciones no soportadas'); return; } Notification.requestPermission().then(p => { setNotif(p); if (p === 'granted') ping('Recordatorio activado'); }); };

            /* ---- backups ---- */
            const exportBackup = () => {
                const a = document.createElement('a');
                a.href = URL.createObjectURL(new Blob([JSON.stringify({ profile, history, weightLog, version: 'MP3' }, null, 2)], { type: 'application/json' }));
                a.download = `${todayStr()}_MDPower.json`; a.click();
                const t = todayStr(); localStorage.setItem('mp2_lastbackup', t); setLastBackup(t); ping('Copia descargada');
            };
            const importBackup = (e) => {
                const f = e.target.files[0]; if (!f) return; const rd = new FileReader();
                rd.onload = (ev) => {
                    try {
                        const d = JSON.parse(ev.target.result);
                        if (d.history || d.weightLog) {
                            const hist = (d.history || []).map(normEntry).filter(Boolean).sort((a, b) => new Date(b.date) - new Date(a.date));
                            const wl = (d.weightLog || []).filter(x => x && x.date).sort((a, b) => new Date(b.date) - new Date(a.date));
                            if (confirm(`¿Restaurar ${hist.length} sesiones y ${wl.length} pesos? Reemplaza los datos actuales.`)) {
                                if (d.profile) setProfile(profileFrom(d.profile));
                                setHistory(hist); setWeightLog(wl); ping('Datos restaurados');
                            }
                        } else ping('Archivo no válido');
                    } catch { ping('Error al leer el archivo'); }
                };
                rd.readAsText(f); e.target.value = null;
            };
            const exportReport = () => {
                const lim = range === 9999 ? new Date(0) : new Date(Date.now() - range * 86400000);
                const data = history.filter(h => new Date(h.date) >= lim).sort((a, b) => new Date(b.date) - new Date(a.date));
                const wl = weightLog.filter(w => new Date(w.date) >= lim);
                const css = `font-family:Arial,Helvetica,sans-serif;`;
                let html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="UTF-8"></head>
                <body style="${css}background:#0B0F19;padding:24px;color:#E2E8F0;">
                <div style="font-size:22px;font-weight:800;letter-spacing:-0.5px;">MOLDOVAN·POWER</div>
                <div style="font-size:11px;color:#64748B;margin-bottom:18px;">Informe · ${todayStr()} · Racha actual ${streak} días</div>
                <table style="${css}border-collapse:collapse;width:100%;font-size:12px;">
                <tr style="background:#10B981;color:#fff;text-align:left;"><th style="padding:8px 10px;">Fecha</th><th style="padding:8px 10px;">Día</th><th style="padding:8px 10px;">P.Corp</th><th style="padding:8px 10px;">Ejercicio</th><th style="padding:8px 10px;">Serie</th><th style="padding:8px 10px;">Kg</th><th style="padding:8px 10px;">Dato</th>${ZONES.map(z => `<th style="padding:8px 10px;">${z.short}</th>`).join('')}<th style="padding:8px 10px;">Notas</th></tr>`;
                let alt = false;
                data.forEach(h => {
                    const dd = DAYS[h.dayType] || DAYS.rest; const bg = (alt = !alt) ? '#121826' : '#0F1521';
                    const base = `<td style="padding:7px 10px;color:#94A3B8;">${h.date}</td><td style="padding:7px 10px;color:${dd.accent};font-weight:700;">${dd.label}</td><td style="padding:7px 10px;">${h.bw}</td>`;
                    const tail = `${ZONES.map(z => `<td style="padding:7px 10px;">${h.pain[z.k] ?? 0}</td>`).join('')}<td style="padding:7px 10px;color:#64748B;">${h.notes || ''}</td>`;
                    const row = (mid) => { html += `<tr style="background:${bg};">${base}${mid}${tail}</tr>`; };
                    if (!h.exercises || !h.exercises.length) { row(`<td colspan="4" style="padding:7px 10px;color:#475569;">—</td>`); return; }
                    h.exercises.forEach(e => {
                        if (e.kind === 'checklist') row(`<td style="padding:7px 10px;">${e.name}</td><td colspan="2"></td><td style="padding:7px 10px;">${e.done ? '✓' : '·'}</td>`);
                        else if (e.kind === 'cardio') { const c = e.cardio || {}; row(`<td style="padding:7px 10px;">${e.name} · ${CARDIO_METHODS[c.method] || ''}</td><td colspan="2"></td><td style="padding:7px 10px;">${[c.km && c.km + 'km', c.time && c.time + 'min', c.rounds && c.rounds + 'rnd', c.ppm && c.ppm + 'ppm'].filter(Boolean).join(' ')}</td>`); }
                        else if (e.kind === 'timer') (e.sets || []).forEach((s, i) => row(`<td style="padding:7px 10px;">${e.name}</td><td style="padding:7px 10px;">${i + 1}</td><td></td><td style="padding:7px 10px;">${fmt(Number(s.sec) || 0)} ${s.done ? '✓' : ''}</td>`));
                        else (e.sets || []).forEach((s, i) => row(`<td style="padding:7px 10px;">${e.name}</td><td style="padding:7px 10px;color:#64748B;">${s.label || i + 1}</td><td style="padding:7px 10px;">${s.w || ''}</td><td style="padding:7px 10px;font-weight:700;">${s.r || ''}</td>`));
                    });
                });
                html += `</table>`;
                if (wl.length) {
                    html += `<div style="font-size:14px;font-weight:800;margin:22px 0 8px;">Peso & Grasa</div><table style="${css}border-collapse:collapse;width:100%;font-size:12px;"><tr style="background:#3B82F6;color:#fff;text-align:left;"><th style="padding:8px 10px;">Fecha</th><th style="padding:8px 10px;">Peso (kg)</th><th style="padding:8px 10px;">Grasa (%)</th></tr>`;
                    let a2 = false;
                    wl.sort((a, b) => new Date(b.date) - new Date(a.date)).forEach(w => { const bg = (a2 = !a2) ? '#121826' : '#0F1521'; html += `<tr style="background:${bg};"><td style="padding:7px 10px;color:#94A3B8;">${w.date}</td><td style="padding:7px 10px;font-weight:700;">${w.w || ''}</td><td style="padding:7px 10px;">${w.fat || ''}</td></tr>`; });
                    html += `</table>`;
                }
                html += `</body></html>`;
                const a = document.createElement('a');
                a.href = URL.createObjectURL(new Blob([html], { type: 'application/vnd.ms-excel' }));
                a.download = `MoldovanPower_informe_${todayStr()}.xls`; a.click();
            };

            const buildSeries = (key) => {
                const m = METRICS[key]; if (!m) return { pts: [], unit: '', sec: false };
                const pts = [];
                if (m.src === 'weight' || m.src === 'fat') {
                    [...weightLog].sort((a, b) => new Date(a.date) - new Date(b.date)).forEach(w => { const v = parseFloat(m.src === 'weight' ? w.w : w.fat); if (v > 0) pts.push({ v }); });
                } else if (m.src === 'pain') {
                    [...history].sort((a, b) => new Date(a.date) - new Date(b.date)).filter(h => h.painSet !== false).forEach(h => { pts.push({ v: Number((h.pain || {})[m.zone]) || 0 }); });
                } else if (m.src === 'ppm') {
                    [...history].sort((a, b) => new Date(a.date) - new Date(b.date)).forEach(h => { const v = (h.exercises || []).filter(e => e.kind === 'cardio').map(e => Number((e.cardio || {}).ppm) || 0).filter(n => n > 0); if (v.length) pts.push({ v: Math.max(...v) }); });
                } else {
                    [...history].sort((a, b) => new Date(a.date) - new Date(b.date)).forEach(h => {
                        const ex = (h.exercises || []).find(e => e.name === m.ex); if (!ex) return;
                        if (m.src === 'maxW') { const ws = (ex.sets || []).map(s => parseFloat(s.w)).filter(n => n > 0); if (ws.length) pts.push({ v: Math.max(...ws) }); }
                        if (m.src === 'sumR') { const rs = (ex.sets || []).map(s => parseInt(s.r)).filter(n => n > 0); if (rs.length) pts.push({ v: rs.reduce((a, b) => a + b, 0) }); }
                        if (m.src === 'maxSec') { const ss = (ex.sets || []).map(s => Number(s.sec) || 0).filter(n => n > 0); if (ss.length) pts.push({ v: Math.max(...ss) }); }
                    });
                }
                return { pts, unit: m.unit, sec: m.src === 'maxSec' };
            };

            /* ---------- HEADER ---------- */
            const Header = (
                <div className="px-5 pt-[max(16px,var(--safe-t))] pb-3 flex items-center justify-between sticky top-0 z-20 bg-[#0B0F19]/85 backdrop-blur-xl">
                    <div><h1 className="font-black text-xl tracking-tight leading-none">MOLDOVAN<span style={{ color: theme.accent }}>·POWER</span></h1><p className="text-[11px] text-slate-500 font-medium mt-1">Postura · Rehab · Gym</p></div>
                    <div className="flex items-center gap-3">
                        <div className="flex items-center gap-1 px-2.5 py-1.5 rounded-full" style={{ background: streak > 0 ? '#F59E0B22' : '#1E293B' }}>
                            <span style={{ color: streak > 0 ? '#F59E0B' : '#475569' }}><Ic d={I.flame} s={16} /></span>
                            <span className="font-black text-sm" style={{ color: streak > 0 ? '#F59E0B' : '#475569' }}>{streak}</span>
                        </div>
                        <div className="text-right"><div className="text-[10px] uppercase tracking-widest font-bold text-slate-500">Toca</div><div className="text-sm font-bold" style={{ color: DAYS[suggestType].accent }}>{DAYS[suggestType].short}</div></div>
                    </div>
                </div>
            );

            const SetRows = (ex, i) => {
                const showKg = ex.kind !== 'reps';
                const total = (ex.sets || []).reduce((a, s) => a + (parseInt(s.r) || 0), 0);
                return (<>
                    {ex.sets.map((st, j) => (
                        <div key={j} className="flex gap-2 items-stretch">
                            <div className="w-12 flex items-center justify-center text-[10px] font-black text-slate-500 text-center">{st.label || ex.sets.slice(0, j + 1).filter(x => !isWarmSet(x)).length}</div>
                            {showKg && (<div className="flex-1 bg-[#0B0F19] rounded-xl px-3 py-2 border border-white/[0.06]"><label className="text-[9px] block text-slate-500 font-bold uppercase">Peso kg</label><input type="number" inputMode="decimal" placeholder="0" value={st.w} onChange={e => updEx(i, x => { x.sets[j].w = e.target.value; return x; })} className="bg-transparent w-full font-black text-base outline-none" /></div>)}
                            <div className="flex-1 bg-[#0B0F19] rounded-xl px-3 py-2 border border-white/[0.06]"><label className="text-[9px] block text-slate-500 font-bold uppercase">Reps</label><input type="number" inputMode="numeric" placeholder="0" value={st.r} onChange={e => updEx(i, x => { x.sets[j].r = e.target.value; return x; })} className="bg-transparent w-full font-black text-base outline-none" /></div>
                            {ex.sets.length > 1 && <button onClick={() => updEx(i, x => { x.sets.splice(j, 1); return x; })} className="w-7 flex items-center justify-center text-slate-700 tap"><Ic d={I.trash} s={15} /></button>}
                        </div>
                    ))}
                    <button onClick={() => updEx(i, x => { x.sets.push({ w: x.sets.at(-1)?.w || '', r: '' }); return x; })} className="w-full py-2.5 border border-dashed border-white/10 rounded-xl text-xs font-bold text-slate-500 flex items-center justify-center gap-1 tap"><Ic d={I.plus} s={14} /> Añadir serie</button>
                    {ex.sets.length > 1 && total > 0 && <div className="text-right text-[11px] font-bold text-slate-500 pt-0.5">Total entreno: <span style={{ color: theme.accent }}>{total} reps</span></div>}
                </>);
            };

            const LV = { red: { c: '#F43F5E', bg: '#F43F5E14', b: '#F43F5E44' }, amber: { c: '#F59E0B', bg: '#F59E0B14', b: '#F59E0B44' } };
            const ExerciseCard = (ex, i) => {
                const last = lastPerf(ex.name);
                const st = exStatus(ex);
                const pr = progress(ex);
                const restSec = ex.rest || (dayType === 'light' && ex.kind !== 'cardio' ? 90 : 0);
                const ac = theme.accent;
                return (<Card key={i} className="overflow-hidden fade-in" >
                    <div className="px-4 py-3 flex items-start justify-between border-b border-white/[0.06]" style={{ background: (st?.lvl === 'red' ? '#F43F5E' : ac) + '12' }}>
                        <div className="min-w-0 flex-1">
                            <div className="font-bold text-sm leading-snug" style={{ color: st?.lvl === 'red' ? '#FDA4AF' : ac }}>{ex.name}</div>
                            {ex.target && <div className="text-[11px] font-bold text-slate-300 mt-0.5">{ex.target}</div>}
                            {last && <div className="text-[10px] text-slate-500 mt-1 whitespace-pre-line leading-snug">{last}</div>}
                        </div>
                        <div className="flex items-center gap-2.5 shrink-0 ml-2 pt-0.5">
                            {restSec > 0 && <button onClick={() => { setRestAt(i); setRestNonce(n => n + 1); }} className="tap flex items-center gap-1 text-[11px] font-black px-2 py-1 rounded-lg" style={{ color: ac, background: ac + '1F' }} aria-label={`Descanso ${restSec} segundos`}><Ic d={I.clock} s={15} /> {fmt(restSec)}</button>}
                            {ex.video && <a href={ex.video} target="_blank" rel="noreferrer" className="tap flex items-center gap-1 text-[11px] font-black px-2 py-1 rounded-lg text-slate-200 bg-white/[0.06]" aria-label="Ver vídeo"><Ic d={I.play} s={15} /> Vídeo</a>}
                            <button onClick={() => delExAt(i)} className="text-slate-600 tap" aria-label="Quitar ejercicio"><Ic d={I.trash} s={16} /></button>
                        </div>
                    </div>
                    <div className="px-4 pt-3 space-y-2">
                        {ex.cue && <p className="text-[11.5px] leading-relaxed text-slate-300 rounded-xl p-2.5 border-l-2" style={{ background: ac + '0D', borderColor: ac }}>{ex.cue}</p>}
                        {ex.cond && <p className="text-[11px] leading-relaxed text-amber-200/90 bg-amber-500/[0.07] rounded-xl p-2.5">{ex.cond}</p>}
                        {st && <p className="text-[11px] font-bold leading-relaxed rounded-xl p-2.5 border" style={{ color: LV[st.lvl].c, background: LV[st.lvl].bg, borderColor: LV[st.lvl].b }}>{st.lvl === 'red' ? 'Semáforo rojo · ' : 'Modo protección · '}{st.txt}</p>}
                        {pr && <p className="text-[11px] font-bold leading-relaxed rounded-xl p-2.5" style={pr.up ? { color: '#6EE7B7', background: '#10B98118' } : { color: '#94A3B8', background: '#ffffff08' }}>{pr.up ? '▲ ' : '= '}{pr.txt}</p>}
                        {ex.note && <p className="text-[11px] leading-relaxed text-slate-400 bg-white/[0.03] rounded-xl p-2.5">{ex.note}</p>}
                    </div>
                    {ex.kind === 'cardio' ? <CardioBlock ex={ex} accent={ac} onChange={u => updEx(i, () => u)} /> : (
                        <div className="p-4 space-y-3">
                            {ex.kind === 'checklist' && <button onClick={() => updEx(i, e => ({ ...e, done: !e.done }))} className="w-full py-4 rounded-2xl font-bold text-sm flex items-center justify-center gap-2 tap border" style={ex.done ? { background: ac, borderColor: ac, color: '#fff' } : { borderColor: '#ffffff18', color: '#94a3b8' }}><Ic d={I.check} s={18} /> {ex.done ? 'Completado' : 'Marcar como hecho'}</button>}
                            {ex.kind === 'timer' && (<>
                                {ex.sets.map((st2, j) => <TimerSet key={j} st={st2} halfBeep={ex.halfBeep} accent={ac} canDel={ex.sets.length > 1} onDel={() => updEx(i, x => { x.sets.splice(j, 1); return x; })} onChange={u => updEx(i, x => { x.sets[j] = u; return x; })} />)}
                                <button onClick={() => updEx(i, x => { x.sets.push({ sec: x.sets.at(-1)?.sec || 60, done: false }); return x; })} className="w-full py-2.5 border border-dashed border-white/10 rounded-xl text-xs font-bold text-slate-500 flex items-center justify-center gap-1 tap"><Ic d={I.plus} s={14} /> Añadir serie</button>
                            </>)}
                            {(ex.kind === 'weighted' || ex.kind === 'reps') && SetRows(ex, i)}
                        </div>
                    )}
                    {restSec > 0 && restAt === i && <div className="px-4 pb-4"><RestTimer key={restNonce} accent={ac} seconds={restSec} onClose={() => setRestAt(null)} /></div>}
                </Card>);
            };

            // Diario semana
            const weekDays = useMemo(() => {
                const base = new Date(); base.setHours(0, 0, 0, 0);
                const dow = (base.getDay() + 6) % 7; // lunes=0
                const mon = new Date(base); mon.setDate(base.getDate() - dow + weekOff * 7);
                return Array.from({ length: 7 }, (_, k) => { const d = new Date(mon); d.setDate(mon.getDate() + k); return dstr(d); });
            }, [weekOff]);
            // Diario mes
            const monthGrid = useMemo(() => {
                const now = new Date(); const m = new Date(now.getFullYear(), now.getMonth() + monOff, 1);
                const first = (m.getDay() + 6) % 7; const days = new Date(m.getFullYear(), m.getMonth() + 1, 0).getDate();
                const cells = []; for (let i = 0; i < first; i++) cells.push(null);
                for (let d = 1; d <= days; d++) cells.push(dstr(new Date(m.getFullYear(), m.getMonth(), d)));
                return { label: m.toLocaleDateString('es', { month: 'long', year: 'numeric' }), cells };
            }, [monOff]);

            return (
                <div className="min-h-screen text-slate-100 max-w-md mx-auto flex flex-col" style={{ '--accent': theme.accent }}>
                    {Header}
                    <div className="flex-1 overflow-y-auto no-scrollbar px-4 pb-28">

                        {tab === 'today' && (
                            <div className="space-y-4 pt-2">
                                {needBackup && !hideBackupBanner && (
                                    <div className="rounded-2xl p-3.5 flex items-center gap-3 fade-in" style={{ background: '#F59E0B1A', border: '1px solid #F59E0B55' }}>
                                        <span style={{ color: '#F59E0B' }}><Ic d={I.save} s={20} /></span>
                                        <div className="flex-1 min-w-0">
                                            <div className="text-xs font-bold" style={{ color: '#FCD34D' }}>{lastBackup ? `Hace ${daysSinceBackup} días sin copia` : 'Aún no has hecho copia'}</div>
                                            <div className="text-[10px] text-slate-400">Protege tus datos: exporta el JSON.</div>
                                        </div>
                                        <button onClick={exportBackup} className="px-3 py-2 rounded-xl text-xs font-black text-white tap shrink-0" style={{ background: '#F59E0B' }}>Exportar</button>
                                        <button onClick={() => setHideBackupBanner(true)} className="text-slate-500 tap shrink-0 px-1 font-bold">✕</button>
                                    </div>
                                )}
                                <Card className="p-2 flex items-center gap-2">
                                    <input type="date" value={date} onChange={e => setDate(e.target.value)} className="bg-transparent flex-1 min-w-0 font-bold px-2 outline-none" />
                                    <select value={dayType} onChange={e => changeDay(e.target.value)} className="bg-transparent font-black text-[13px] text-right outline-none px-2 max-w-[58%]" style={{ color: theme.accent }}>{(ORDER.includes(dayType) ? ORDER : [...ORDER, dayType]).map(k => <option key={k} value={k}>{(DAYS[k] || DAYS.rest).label}</option>)}</select>
                                </Card>
                                <div className="flex items-center gap-2 px-1"><div className="h-2 w-2 rounded-full shrink-0" style={{ background: theme.accent }} /><span className="text-xs font-semibold text-slate-400">{theme.sub}</span></div>

                                {(() => {
                                    const vals = ZONES.map(z => session.pain[z.k] || 0); const mx = Math.max(...vals);
                                    const lvl = !session.painSet ? null : mx >= 5 ? 'red' : mx >= 3 ? 'amber' : 'green';
                                    const col = { red: '#F43F5E', amber: '#F59E0B', green: '#10B981' }[lvl] || '#64748B';
                                    const affected = session.painSet ? session.exercises.filter(e => exStatus(e)).length : 0;
                                    const open = painOpen || !session.painSet;
                                    const setZ = (k, v) => { setPainOpen(true); setSession(s => ({ ...s, painSet: true, pain: { ...s.pain, [k]: v } })); };
                                    return (<Card className="overflow-hidden">
                                        <button onClick={() => setPainOpen(o => !o)} className="w-full px-4 py-3 flex items-center justify-between tap" style={{ background: col + '14' }}>
                                            <div className="flex items-center gap-2.5 min-w-0">
                                                <span className="w-3 h-3 rounded-full shrink-0" style={{ background: col, boxShadow: `0 0 10px ${col}` }} />
                                                <div className="text-left min-w-0">
                                                    <div className="text-[10px] font-black uppercase tracking-widest text-slate-400">Semáforo de hoy</div>
                                                    <div className="text-xs font-bold truncate" style={{ color: lvl ? col : '#94A3B8' }}>{!lvl ? 'Antes de entrenar: ¿cómo están tus zonas?' : lvl === 'green' ? 'Todo en verde · entreno normal' : `${ZONES.filter(z => (session.pain[z.k] || 0) >= 3).map(z => `${z.short} ${session.pain[z.k]}`).join(' · ')} · ${affected} ejercicio${affected === 1 ? '' : 's'} adaptado${affected === 1 ? '' : 's'}`}</div>
                                                </div>
                                            </div>
                                            <span className="text-slate-500 shrink-0" style={{ transform: open ? 'rotate(90deg)' : 'none', transition: '.2s' }}><Ic d={I.chev} s={18} /></span>
                                        </button>
                                        {open && <div className="p-4 space-y-4 fade-in">
                                            {ZONES.map(z => <PainSlider key={z.k} label={z.label} value={session.pain[z.k] || 0} onChange={v => setZ(z.k, v)} />)}
                                            <div className="flex gap-2">
                                                <button onClick={() => { setSession(s => ({ ...s, painSet: true, pain: emptyPain() })); setPainOpen(false); }} className="flex-1 py-2.5 rounded-xl text-xs font-black tap border border-emerald-500/30 text-emerald-300">Todo a 0</button>
                                                <button onClick={() => { setSession(s => ({ ...s, painSet: true })); setPainOpen(false); }} className="flex-1 py-2.5 rounded-xl text-xs font-black tap text-white" style={{ background: theme.accent }}>Listo</button>
                                            </div>
                                            <p className="text-[10px] text-slate-500 leading-relaxed">0-2 verde: entreno normal · 3-4 ámbar: modo protección en los ejercicios que cargan esa zona · 5+ rojo: sáltalos y coméntalo con el fisio. Pon también cómo amaneció la rodilla: el dolor sinovial aparece 24-48 h después.</p>
                                        </div>}
                                    </Card>);
                                })()}

                                {BLOCK_ORDER.map(bk => {
                                    const items = session.exercises.map((ex, i) => [ex, i]).filter(([ex]) => (BLOCKS[ex.block] ? ex.block : 'main') === bk);
                                    if (!items.length) return null;
                                    const done = items.filter(([ex]) => ex.kind === 'checklist' ? ex.done : ex.kind === 'timer' ? (ex.sets || []).every(s => s.done) : ex.kind === 'cardio' ? !!(ex.cardio && (ex.cardio.time || ex.cardio.km)) : (ex.sets || []).some(s => s.r !== '' && !isWarmSet(s))).length;
                                    return (<div key={bk} className="space-y-3">
                                        <div className="flex items-baseline justify-between px-1 pt-2">
                                            <h3 className="text-[11px] font-black uppercase tracking-[0.18em]" style={{ color: theme.accent }}>{BLOCKS[bk]}</h3>
                                            <span className="text-[10px] font-bold text-slate-500 tabular-nums">{done}/{items.length}</span>
                                        </div>
                                        {items.map(([ex, i]) => ExerciseCard(ex, i))}
                                    </div>);
                                })}

                                {(SUGGEST[dayType] || []).length > 0 && (
                                    <div className="flex flex-wrap gap-2">{SUGGEST[dayType].map(s => <button key={s.name} onClick={() => pushEx(s)} className="px-3 py-2 rounded-xl text-[11px] font-bold border border-white/10 text-slate-300 tap flex items-center gap-1"><Ic d={I.plus} s={13} /> {s.name}</button>)}</div>
                                )}

                                {adding ? (
                                    <Card className="p-4 space-y-3 fade-in">
                                        <input autoFocus placeholder="Nombre del ejercicio" value={newEx.name} onChange={e => setNewEx({ ...newEx, name: e.target.value })} className="w-full bg-[#0B0F19] border border-white/[0.06] rounded-xl p-3 outline-none" />
                                        <select value={newEx.kind} onChange={e => setNewEx({ ...newEx, kind: e.target.value })} className="w-full bg-[#0B0F19] border border-white/[0.06] rounded-xl p-3 outline-none"><option value="weighted">Peso + reps</option><option value="reps">Solo reps</option><option value="timer">Temporizador</option><option value="checklist">Checklist</option><option value="cardio">Cardio</option></select>
                                        <div className="flex gap-2"><button onClick={() => setAdding(false)} className="flex-1 py-3 rounded-xl border border-white/10 font-bold text-sm text-slate-400 tap">Cancelar</button><button onClick={addEx} className="flex-1 py-3 rounded-xl font-bold text-sm text-white tap" style={{ background: theme.accent }}>Añadir</button></div>
                                    </Card>
                                ) : <button onClick={() => setAdding(true)} className="w-full py-3 border border-dashed border-white/10 rounded-2xl text-sm font-bold text-slate-500 flex items-center justify-center gap-2 tap"><Ic d={I.plus} s={16} /> Añadir ejercicio</button>}

                                <Card className="overflow-hidden">
                                    <button onClick={() => setCardioOpen(o => !o)} className="w-full px-4 py-3 flex items-center justify-between tap"><span className="font-bold text-sm flex items-center gap-2 text-slate-300"><Ic d={I.heart} s={16} /> Añadir cardio</span><span className="text-slate-500" style={{ transform: cardioOpen ? 'rotate(90deg)' : 'none', transition: '.2s' }}><Ic d={I.chev} s={18} /></span></button>
                                    {cardioOpen && <div className="px-4 pb-4 grid grid-cols-2 gap-2 fade-in">{CARDIO_OFFER.map(m => <button key={m} onClick={() => addCardio(m)} className="py-3 rounded-xl text-xs font-bold border border-white/10 text-slate-300 tap">{CARDIO_METHODS[m]}</button>)}</div>}
                                </Card>

                                <Card className="p-4 space-y-3">
                                    <h3 className="text-[10px] font-black uppercase tracking-widest text-slate-500">Notas</h3>
                                    <textarea placeholder="Sensaciones, molestias durante el entreno, máquina usada…" value={session.notes} onChange={e => setSession(s => ({ ...s, notes: e.target.value }))} className="w-full bg-[#0B0F19] border border-white/[0.06] rounded-xl p-3 text-sm outline-none h-24 resize-none" />
                                </Card>

                                <button onClick={save} className="w-full py-5 rounded-2xl font-black text-base text-white flex items-center justify-center gap-2 tap" style={{ background: theme.accent, boxShadow: `0 10px 30px -10px ${theme.accent}` }}><Ic d={I.save} /> GUARDAR SESIÓN</button>
                                {history.find(h => h.date === date) && (
                                    <button onClick={() => {
                                        const entry = history.find(h => h.date === date); if (!entry) return;
                                        if (!confirm('¿Borrar la sesión guardada de este día?')) return;
                                        const newHist = history.filter(x => x.id !== entry.id);
                                        setHistory(newHist);
                                        const sg = newHist.length ? nextAfter(newHist[0].dayType) : ORDER[0];
                                        const ls = newHist.find(x => x.dayType === sg);
                                        setSession({ dayType: sg, pain: emptyPain(), painSet: false, notes: '', exercises: seed(sg, profile.oneRM, ls ? ls.exercises : null, baseFor(sg)) });
                                        ping('Sesión borrada');
                                    }} className="w-full py-3 rounded-2xl font-bold text-xs text-rose-400/80 flex items-center justify-center gap-2 tap border border-rose-500/20"><Ic d={I.trash} s={14} /> Borrar sesión guardada</button>
                                )}
                            </div>
                        )}

                        {tab === 'weight' && (
                            <div className="space-y-4 pt-2">
                                <h2 className="text-2xl font-black px-1">Peso</h2>
                                <Card className="p-5 space-y-3">
                                    <input type="date" value={wForm.date} onChange={e => setWForm({ ...wForm, date: e.target.value })} className="w-full bg-[#0B0F19] border border-white/[0.06] rounded-xl p-3 font-bold outline-none" />
                                    <div className="flex gap-2">
                                        <div className="flex-1 bg-[#0B0F19] rounded-xl px-3 py-2 border border-white/[0.06]"><label className="text-[9px] block text-slate-500 font-bold uppercase">Peso (kg)</label><input type="number" inputMode="decimal" placeholder="0" value={wForm.w} onChange={e => setWForm({ ...wForm, w: e.target.value })} className="bg-transparent w-full font-black text-lg outline-none" /></div>
                                        <div className="flex-1 bg-[#0B0F19] rounded-xl px-3 py-2 border border-white/[0.06]"><label className="text-[9px] block text-slate-500 font-bold uppercase">% Grasa (báscula)</label><input type="number" inputMode="decimal" placeholder="0" value={wForm.fat} onChange={e => setWForm({ ...wForm, fat: e.target.value })} className="bg-transparent w-full font-black text-lg outline-none" /></div>
                                    </div>
                                    <p className="text-[10px] text-slate-500">El % de grasa de la báscula es orientativo, no exacto. Úsalo como tendencia.</p>
                                    <button onClick={saveWeight} className="w-full py-3.5 rounded-xl font-black text-sm text-white tap flex items-center justify-center gap-2" style={{ background: '#14B8A6' }}><Ic d={I.save} s={18} /> Registrar</button>
                                </Card>
                                <div className="space-y-2">
                                    {weightLog.length === 0 && <Card className="p-8 text-center text-xs font-bold uppercase tracking-widest text-slate-600">Sin registros</Card>}
                                    {weightLog.slice(0, 30).map((w, k) => {
                                        const prev = weightLog[k + 1]; const dl = prev ? (parseFloat(w.w) - parseFloat(prev.w)) : 0;
                                        return (<Card key={w.date} className="p-4 flex items-center justify-between">
                                            <div><div className="font-black text-sm">{w.date}</div><div className="text-[11px] text-slate-500 font-bold mt-0.5">{w.w} kg{w.fat ? ` · ${w.fat}% grasa` : ''}</div></div>
                                            <div className="flex items-center gap-3">
                                                {prev && <span className="text-[11px] font-bold" style={{ color: dl <= 0 ? '#10B981' : '#F43F5E' }}>{dl > 0 ? '+' : ''}{dl.toFixed(1)}</span>}
                                                <button onClick={() => delWeight(w.date)} className="text-slate-700 tap"><Ic d={I.trash} s={15} /></button>
                                            </div>
                                        </Card>);
                                    })}
                                </div>
                            </div>
                        )}

                        {tab === 'stats' && (
                            <div className="space-y-4 pt-2">
                                <h2 className="text-2xl font-black px-1">Progreso</h2>
                                {[0, 1, 2].map(slot => {
                                    const key = charts[slot]; const { pts, unit, sec } = buildSeries(key);
                                    return (<Card key={slot} className="p-5 space-y-2">
                                        <select value={key} onChange={e => setCharts(c => c.map((x, i) => i === slot ? e.target.value : x))} className="w-full bg-[#0B0F19] border border-white/[0.06] rounded-xl p-2.5 font-bold text-sm outline-none mb-2">
                                            {Object.keys(METRICS).map(m => <option key={m} value={m}>{METRICS[m].label}</option>)}
                                        </select>
                                        <MiniChart pts={pts} unit={unit} accent={theme.accent} secMode={sec} />
                                    </Card>);
                                })}
                            </div>
                        )}

                        {tab === 'diary' && (
                            <div className="space-y-4 pt-2">
                                <div className="flex items-center justify-between px-1"><h2 className="text-2xl font-black">Diario</h2>
                                    <div className="flex bg-[#121826] border border-white/[0.06] rounded-xl p-1">
                                        {['week', 'month'].map(v => <button key={v} onClick={() => setDiaryView(v)} className="px-3 py-1.5 rounded-lg text-xs font-bold tap" style={diaryView === v ? { background: theme.accent, color: '#fff' } : { color: '#64748b' }}>{v === 'week' ? 'Semana' : 'Mes'}</button>)}
                                    </div>
                                </div>

                                {diaryView === 'week' && (<>
                                    <div className="flex items-center justify-between">
                                        <button onClick={() => setWeekOff(o => o - 1)} className="p-2 text-slate-500 tap" style={{ transform: 'rotate(180deg)' }}><Ic d={I.arrow} s={18} /></button>
                                        <span className="text-xs font-bold text-slate-400">{weekOff === 0 ? 'Esta semana' : `${weekDays[0]} → ${weekDays[6]}`}</span>
                                        <button onClick={() => setWeekOff(o => Math.min(0, o + 1))} className="p-2 text-slate-500 tap"><Ic d={I.arrow} s={18} /></button>
                                    </div>
                                    <div className="space-y-2">
                                        {weekDays.map(ds => {
                                            const h = history.find(x => x.date === ds); const w = weightLog.find(x => x.date === ds);
                                            const dd = h ? (DAYS[h.dayType] || DAYS.rest) : null;
                                            const wd = new Date(ds).toLocaleDateString('es', { weekday: 'short' });
                                            const isToday = ds === todayStr();
                                            return (<div key={ds} onClick={() => { setDate(ds); setTab('today'); }}
                                                className="rounded-2xl p-4 flex items-center justify-between tap border" style={h ? { background: dd.accent + '1F', borderColor: dd.accent + '55' } : { background: '#121826', borderColor: isToday ? '#ffffff22' : 'transparent' }}>
                                                <div className="flex items-center gap-3">
                                                    <div className="w-10 text-center"><div className="text-[10px] uppercase font-bold text-slate-500">{wd}</div><div className="font-black text-lg" style={h ? { color: dd.accent } : { color: '#475569' }}>{new Date(ds).getDate()}</div></div>
                                                    <div>{h ? (<><div className="font-bold text-sm" style={{ color: dd.accent }}>{dd.label}</div><div className="text-[10px] text-slate-500 font-bold">{(h.exercises || []).length} ej{(() => { const z = ZONES.reduce((b, x) => ((h.pain[x.k] || 0) > (h.pain[b.k] || 0) ? x : b), ZONES[0]); const v = h.pain[z.k] || 0; return v ? ` · ${z.short} ${v}/10` : ''; })()}{w ? ` · ${w.w}kg` : ''}</div></>) : (<div className="text-xs font-bold text-slate-600">{w ? `${w.w} kg registrado` : (isToday ? 'Hoy — sin registrar' : 'Sin entreno')}</div>)}</div>
                                                </div>
                                                <Ic d={I.chev} s={16} c="#475569" />
                                            </div>);
                                        })}
                                    </div>
                                </>)}

                                {diaryView === 'month' && (<>
                                    <div className="flex items-center justify-between">
                                        <button onClick={() => setMonOff(o => o - 1)} className="p-2 text-slate-500 tap" style={{ transform: 'rotate(180deg)' }}><Ic d={I.arrow} s={18} /></button>
                                        <span className="text-xs font-bold text-slate-400 capitalize">{monthGrid.label}</span>
                                        <button onClick={() => setMonOff(o => Math.min(0, o + 1))} className="p-2 text-slate-500 tap"><Ic d={I.arrow} s={18} /></button>
                                    </div>
                                    <Card className="p-4">
                                        <div className="grid grid-cols-7 gap-1.5 mb-2">{['L', 'M', 'X', 'J', 'V', 'S', 'D'].map((d, i) => <div key={i} className="text-center text-[10px] font-black text-slate-600">{d}</div>)}</div>
                                        <div className="grid grid-cols-7 gap-1.5">
                                            {monthGrid.cells.map((ds, i) => {
                                                if (!ds) return <div key={i} />;
                                                const h = history.find(x => x.date === ds); const w = weightLog.find(x => x.date === ds);
                                                const dd = h ? (DAYS[h.dayType] || DAYS.rest) : null; const isToday = ds === todayStr();
                                                return (<div key={i} onClick={() => { setDate(ds); setTab('today'); }}
                                                    className="aspect-square rounded-lg flex items-center justify-center text-[11px] font-black tap"
                                                    style={h ? { background: dd.accent, color: '#fff' } : { background: w ? '#1E293B' : '#0F1521', color: '#475569', outline: isToday ? '1.5px solid #ffffff33' : 'none' }}>
                                                    {new Date(ds).getDate()}
                                                </div>);
                                            })}
                                        </div>
                                        <div className="flex flex-wrap gap-x-3 gap-y-1 mt-4 pt-3 border-t border-white/[0.06]">{ORDER.map(k => <div key={k} className="flex items-center gap-1"><div className="w-2.5 h-2.5 rounded-sm" style={{ background: DAYS[k].accent }} /><span className="text-[9px] font-bold text-slate-500">{DAYS[k].short}</span></div>)}</div>
                                    </Card>
                                </>)}
                            </div>
                        )}

                        {tab === 'guide' && (
                            <div className="space-y-4 pt-2">
                                <h2 className="text-2xl font-black px-1">Guía</h2>
                                <Card className="p-5 space-y-3">
                                    <h3 className="text-[10px] font-black uppercase tracking-widest text-slate-500">Cómo progresar</h3>
                                    <p className="text-[12px] text-slate-300 leading-relaxed">Doble progresión conservadora: solo subes peso cuando haces el tope de reps en <b>todas</b> las series, con el tempo y las pausas, y con <b>0/10</b> durante la sesión y a las 24-48 h en esternón, costado, hombro, ingle y rodilla. La app te lo indica en cada ejercicio.</p>
                                    <p className="text-[12px] text-slate-300 leading-relaxed">Entreno submáximo: sin fallo y sin aguantar la respiración. 3-4 ejercicios principales por día; el resto es complemento.</p>
                                </Card>
                                <Card className="p-5 space-y-2.5">
                                    <h3 className="text-[10px] font-black uppercase tracking-widest text-rose-400">Lista negra</h3>
                                    {['Fondos en paralelas (con o sin lastre) y dominadas lastradas.', 'Pec deck y cualquier apertura con máquina o mancuernas.', 'Deltoides posterior en máquina aplastando el pecho contra el cojín.', 'Crunches en suelo, máquina o polea (tiran del esternón y las costillas 5ª-7ª).', 'Planchas boca abajo mientras moleste el costado o el serrato.', 'Sentadilla libre con barra y peso muerto convencional o rumano pesado.', 'Sprints o HIIT (más de 170 ppm) mientras haya inflamación en el esternón o entre las costillas.'].map((t, k) => <div key={k} className="flex gap-2.5 text-[12px] text-slate-300 leading-snug"><span className="text-rose-400 font-black shrink-0">✕</span>{t}</div>)}
                                    <p className="text-[10px] text-slate-500 pt-1">Si añades un ejercicio que suena a alguno de estos, la app te avisa antes.</p>
                                </Card>
                                <Card className="p-5 space-y-3">
                                    <h3 className="text-[10px] font-black uppercase tracking-widest text-slate-500">Cada día, fuera del gimnasio</h3>
                                    {[['Escritorio', 'No apoyes el peso del tronco en el codo izquierdo ni las costillas contra el borde de la mesa.'], ['Dormir de lado', 'Almohada firme entre rodillas y tobillos, para que la pierna de arriba no caiga y gire hacia dentro.'], ['Dormir boca arriba', 'Cojín bajo las rodillas (unos 10° de flexión).'], ['De pie con carga', 'Rodillas siempre con 5° de flexión. Nunca bloqueadas hacia atrás.']].map(([t, d]) => <div key={t}><div className="text-[12px] font-black text-slate-200">{t}</div><div className="text-[12px] text-slate-400 leading-snug">{d}</div></div>)}
                                </Card>
                                {LIBRARY.map(g => (
                                    <Card key={g.title} className="p-5 space-y-1">
                                        <h3 className="text-[10px] font-black uppercase tracking-widest text-slate-500 pb-1">{g.title}</h3>
                                        {g.items.map(([t, u]) => <a key={u} href={u} target="_blank" rel="noreferrer" className="flex items-center gap-3 py-2 tap border-b border-white/[0.04] last:border-0"><span className="shrink-0" style={{ color: theme.accent }}><Ic d={I.play} s={18} /></span><span className="text-[12px] font-semibold text-slate-300 leading-snug">{t}</span></a>)}
                                    </Card>
                                ))}
                                <p className="text-center text-[10px] text-slate-600 px-4">Basado en tu informe técnico-clínico. No sustituye al fisio ni al traumatólogo: si una zona pasa de 5/10, para y consúltalo.</p>
                            </div>
                        )}

                        {tab === 'conf' && (
                            <div className="space-y-4 pt-2">
                                <h2 className="text-2xl font-black px-1">Ajustes</h2>
                                <Card className="p-5 space-y-4">
                                    <h3 className="text-[10px] font-black uppercase tracking-widest text-slate-500">Perfil</h3>
                                    <div><label className="text-[10px] font-bold text-slate-500 uppercase">Peso corporal (kg)</label><input type="number" inputMode="decimal" value={profile.bw} onChange={e => setProfile(p => ({ ...p, bw: e.target.value }))} className="bg-[#0B0F19] rounded-xl p-3 border border-white/[0.06] w-full font-black mt-1" /></div>
                                    <p className="text-[10px] text-slate-500">Programa: Espalda → Cuádriceps → Pecho → Femoral → Hombro → Postura → Descanso. “Toca” pasa al siguiente día después del último que guardaste, sin mirar la fecha.</p>
                                </Card>

                                <Card className="p-5 space-y-3">
                                    <h3 className="text-[10px] font-black uppercase tracking-widest text-slate-500">Editor de días</h3>
                                    <p className="text-[10px] text-slate-500">Personaliza los ejercicios por defecto de cada día. Afecta a los días nuevos que abras (no cambia sesiones ya guardadas).</p>
                                    <div className="grid grid-cols-2 gap-2">
                                        {ORDER.map(k => <button key={k} onClick={() => startEdit(k)} className="py-2.5 rounded-xl text-xs font-bold tap border flex items-center justify-center gap-1.5" style={editList && editDay === k ? { background: DAYS[k].accent, borderColor: DAYS[k].accent, color: '#fff' } : { borderColor: '#ffffff14', color: '#94a3b8' }}><span className="w-2 h-2 rounded-full" style={{ background: editList && editDay === k ? '#fff' : DAYS[k].accent }} />{DAYS[k].label}{Object.prototype.hasOwnProperty.call(templates, k) ? ' *' : ''}</button>)}
                                    </div>
                                    {Object.keys(templates).length > 0 && <p className="text-[9px] text-slate-600">* = día personalizado.</p>}

                                    {editList && (<div className="space-y-2.5 pt-1 fade-in">
                                        <div className="text-[11px] font-black uppercase tracking-widest pt-1" style={{ color: DAYS[editDay].accent }}>{DAYS[editDay].label}</div>
                                        {editList.length === 0 && <p className="text-[11px] text-slate-500 bg-white/[0.03] rounded-xl p-3 text-center">Día vacío. Añade ejercicios o guárdalo así (día de descanso).</p>}
                                        {editList.map((e, k) => (
                                            <div key={k} className="bg-[#0B0F19] rounded-2xl p-3 border border-white/[0.06] space-y-2">
                                                <div className="flex items-center gap-2">
                                                    <input value={e.name} onChange={ev => editUpd(k, x => ({ ...x, name: ev.target.value }))} placeholder="Nombre" className="flex-1 bg-[#121826] rounded-lg px-3 py-2 font-bold text-sm outline-none border border-white/[0.06]" />
                                                    <div className="flex flex-col">
                                                        <button onClick={() => editMove(k, -1)} disabled={k === 0} className="tap px-1.5 text-slate-400 disabled:opacity-20" style={{ transform: 'rotate(-90deg)' }}><Ic d={I.chev} s={16} /></button>
                                                        <button onClick={() => editMove(k, 1)} disabled={k === editList.length - 1} className="tap px-1.5 text-slate-400 disabled:opacity-20" style={{ transform: 'rotate(90deg)' }}><Ic d={I.chev} s={16} /></button>
                                                    </div>
                                                    <button onClick={() => editDel(k)} className="tap text-slate-600 px-1"><Ic d={I.trash} s={16} /></button>
                                                </div>
                                                <div className="flex gap-2">
                                                    <select value={e.kind} onChange={ev => editKind(k, ev.target.value)} className="bg-[#121826] rounded-lg px-2 py-2 text-xs font-bold outline-none border border-white/[0.06]">{Object.keys(KINDS).map(kk => <option key={kk} value={kk}>{KINDS[kk]}</option>)}</select>
                                                    <input value={e.video || ''} onChange={ev => editUpd(k, x => ({ ...x, video: ev.target.value }))} placeholder="URL vídeo (opcional)" className="flex-1 min-w-0 bg-[#121826] rounded-lg px-3 py-2 text-xs outline-none border border-white/[0.06]" />
                                                </div>
                                                <div className="flex gap-2">
                                                    <select value={BLOCKS[e.block] ? e.block : 'main'} onChange={ev => editUpd(k, x => ({ ...x, block: ev.target.value }))} className="bg-[#121826] rounded-lg px-2 py-2 text-xs font-bold outline-none border border-white/[0.06]">{BLOCK_ORDER.map(b => <option key={b} value={b}>{BLOCKS[b]}</option>)}</select>
                                                    <input value={e.target || ''} onChange={ev => editUpd(k, x => ({ ...x, target: ev.target.value }))} placeholder="Objetivo (ej. 3 × 10-12)" className="flex-1 min-w-0 bg-[#121826] rounded-lg px-3 py-2 text-xs outline-none border border-white/[0.06]" />
                                                </div>
                                                <textarea value={e.cue || ''} onChange={ev => editUpd(k, x => ({ ...x, cue: ev.target.value }))} placeholder="Recordatorio técnico" className="w-full bg-[#121826] rounded-lg px-3 py-2 text-xs outline-none border border-white/[0.06] h-16 resize-none" />
                                            </div>
                                        ))}
                                        <button onClick={editAdd} className="w-full py-2.5 border border-dashed border-white/10 rounded-xl text-xs font-bold text-slate-500 flex items-center justify-center gap-1 tap"><Ic d={I.plus} s={14} /> Añadir ejercicio</button>
                                        <div className="flex gap-2 pt-1">
                                            <button onClick={() => setEditList(null)} className="flex-1 py-3 rounded-xl border border-white/10 font-bold text-sm text-slate-400 tap">Cancelar</button>
                                            <button onClick={saveEdit} className="flex-1 py-3 rounded-xl font-black text-sm text-white tap" style={{ background: DAYS[editDay].accent }}>Guardar día</button>
                                        </div>
                                    </div>)}

                                    <button onClick={resetTemplates} className="w-full mt-1 py-2.5 rounded-xl text-[11px] font-bold text-rose-500/70 border border-rose-500/15 tap">Restablecer todo a la base original…</button>
                                </Card>

                                <Card className="p-5 space-y-3">
                                    <h3 className="text-[10px] font-black uppercase tracking-widest text-slate-500">Recordatorio</h3>
                                    <button onClick={reqNotif} className="w-full py-3.5 rounded-xl font-bold text-sm flex items-center justify-center gap-2 tap" style={notif === 'granted' ? { background: theme.accent, color: '#fff' } : { background: '#0B0F19', border: '1px solid #ffffff14', color: '#94a3b8' }}><Ic d={I.bell} s={18} /> {notif === 'granted' ? 'Recordatorio activado (19:30)' : notif === 'unsupported' ? 'No soportado en este navegador' : 'Activar recordatorio 19:30'}</button>
                                    <p className="text-[10px] text-slate-500">Si a las 19:30 no has entrenado ni registrado nada, te avisa para no perder la racha. Requiere tener la app abierta o instalada en pantalla de inicio (Android). Una web no puede notificar de forma garantizada si está totalmente cerrada.</p>
                                </Card>
                                <Card className="p-5 space-y-4">
                                    <h3 className="text-[10px] font-black uppercase tracking-widest text-slate-500">Copia de seguridad</h3>
                                    <p className="text-[10px] text-slate-500">{lastBackup ? `Última copia: ${lastBackup} (hace ${daysSinceBackup} días).` : 'Aún no has hecho ninguna copia.'} La app te avisa a los 14 días. Se guarda en Descargas con nombre fecha_MDPower.json.</p>
                                    <button onClick={exportBackup} className="w-full bg-[#0B0F19] border border-white/[0.06] py-3.5 rounded-xl font-bold text-sm flex items-center justify-center gap-2 tap"><Ic d={I.save} s={18} /> Descargar copia (JSON)</button>
                                    <input type="file" ref={fileRef} onChange={importBackup} className="hidden" accept=".json" />
                                    <button onClick={() => fileRef.current.click()} className="w-full border border-white/10 py-3.5 rounded-xl font-bold text-sm text-slate-400 flex items-center justify-center gap-2 tap"><Ic d={I.up} s={18} /> Restaurar copia (JSON)</button>
                                </Card>
                                <Card className="p-5 space-y-3">
                                    <h3 className="text-[10px] font-black uppercase tracking-widest text-slate-500">Informe</h3>
                                    <div className="flex gap-1.5">{[[30, '1M'], [90, '3M'], [180, '6M'], [365, '1A'], [9999, 'TODO']].map(([rv, l]) => <button key={rv} onClick={() => setRange(rv)} className="flex-1 py-2 text-[11px] font-bold rounded-lg border tap" style={range === rv ? { background: theme.accent, borderColor: theme.accent, color: '#fff' } : { borderColor: '#ffffff14', color: '#64748b' }}>{l}</button>)}</div>
                                    <button onClick={exportReport} className="w-full bg-[#0B0F19] border border-white/[0.06] py-3.5 rounded-xl font-bold text-sm flex items-center justify-center gap-2 tap"><Ic d={I.sheet} s={18} /> Descargar informe</button>
                                </Card>
                                <p className="text-center text-[10px] text-slate-600 pt-2">Moldovan Power · datos en este dispositivo</p>
                            </div>
                        )}
                    </div>

                    <div className="fixed bottom-0 inset-x-0 max-w-md mx-auto z-30">
                        <div className="bg-[#121826]/90 backdrop-blur-xl border-t border-white/[0.06] flex px-1 pb-[max(10px,var(--safe-b))] pt-2">
                            {[['today', I.today, 'Hoy'], ['weight', I.scale, 'Peso'], ['stats', I.chart, 'Progreso'], ['diary', I.diary, 'Diario'], ['guide', I.book, 'Guía'], ['conf', I.cog, 'Ajustes']].map(([k, ic, lb]) => (
                                <button key={k} onClick={() => setTab(k)} className="flex-1 flex flex-col items-center gap-1 py-1.5 tap" style={{ color: tab === k ? theme.accent : '#475569' }}><Ic d={ic} s={21} /><span className="text-[10px] font-bold">{lb}</span></button>
                            ))}
                        </div>
                    </div>

                    {toast && <div className="fixed top-[max(20px,var(--safe-t))] inset-x-0 flex justify-center z-50 pointer-events-none px-4"><div className="bg-white text-slate-900 text-sm font-bold px-5 py-2.5 rounded-full shadow-2xl fade-in flex items-center gap-2 text-center"><Ic d={I.check} s={16} /> {toast}</div></div>}
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js');
        }
    </script>
</body>
</html>
