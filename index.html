    <style>
        :root { --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px); }
        * { -webkit-tap-highlight-color: transparent; }
        html, body { background:#0B0F19; }
        body { overscroll-behavior-y: none; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; margin: 0; }
        input, select, textarea { font-size: 16px !important; color-scheme: dark; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .tap { transition: transform .12s ease, opacity .12s ease; }
        .tap:active { transform: scale(.96); }
        .fade-in { animation: fade .25s ease both; }
        @keyframes fade { from { opacity:0; transform: translateY(6px); } to { opacity:1; transform:none; } }
        input[type=range] { -webkit-appearance:none; appearance:none; height:8px; border-radius:99px; background:#1E293B; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:24px; height:24px; border-radius:50%; background:#fff; border:4px solid var(--thumb,#3B82F6); }
        ::placeholder { color:#475569; }
        select option { background:#0F172A; }

<body>
    <div id="root"></div>

    <script type="text/babel" data-presets="react">
        const { useState, useEffect, useMemo, useRef } = React;

        /* ---------- AUDIO ---------- */
        let actx = null;
        const resumeAudio = () => { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch (e) {} };
        const beep = (freq = 880, ms = 130) => {
            try { if (!actx) return;
                const o = actx.createOscillator(), g = actx.createGain();
                o.connect(g); g.connect(actx.destination); o.type = 'sine'; o.frequency.value = freq;
                const t = actx.currentTime;
                g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.85, t + 0.01);
                g.gain.exponentialRampToValueAtTime(0.0001, t + ms / 1000);
                o.start(t); o.stop(t + ms / 1000);
            } catch (e) {}
        };

        /* ---------- ICONOS ---------- */
        const Ic = ({ d, s = 22, c }) => (
            <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round" style={c ? { color: c } : null}>{d}</svg>
        );
        const I = {
            today:<><path d="M13 2 3 14h7l-1 8 10-12h-7z"/></>,
            scale:<><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8.5 10a3.5 3.5 0 0 1 7 0"/><path d="M12 4v2"/></>,

            trash:<><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M10 11v6M14 11v6"/></>,

            up:<><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></>,
            sheet:<><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/></>,
            play:<><circle cx="12" cy="12" r="10"/><path d="M10 8l6 4-6 4z"/></>,
            pause:<><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></>,
            reload:<><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/></>,
            check:<><path d="M20 6 9 17l-5-5"/></>,
            chev:<><path d="M9 18l6-6-6-6"/></>,
            heart:<><path d="M19 14c1.5-1.5 3-3.2 3-5.5A4.5 4.5 0 0 0 12 6 4.5 4.5 0 0 0 2 8.5C2 13 12 21 12 21z"/></>,
            flame:<><path d="M12 2c1 4-2 5-2 8a3 3 0 0 0 6 0c0-1-.5-2-1-2.5C16 10 19 13 19 16a7 7 0 0 1-14 0c0-5 5-7 7-14z"/></>,
            bell:<><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></>,
            clock:<><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></>,
            arrow:<><path d="M5 12h14M13 6l6 6-6 6"/></>,
            book:<><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></>,
        };

        /* ---------- CONFIG ---------- */
        // Programa "Postura + Rehab" (informe técnico-clínico, nov 2026). 5 días fuerza + 1 día postura/core/cardio + descanso.
        const ORDER = ['back', 'quads', 'chest', 'hams', 'shoulders', 'posture', 'rest'];
        const DAYS = {
            back:      { label: 'Espalda + bíceps',      short: 'Espalda', sub: 'Trapecio medio/inferior y romboides por encima del dorsal (2:1)', accent: '#10B981' },
            quads:     { label: 'Cuádriceps + gemelos',  short: 'Cuád',    sub: 'Protección de menisco · flexión máx. 70-75° con carga',         accent: '#3B82F6' },
            chest:     { label: 'Pecho + tríceps',       short: 'Pecho',   sub: 'Rango acortado · cero tirón sobre el esternón',                  accent: '#F43F5E' },
            hams:      { label: 'Femoral + glúteo',      short: 'Femoral', sub: 'Sin peso muerto · cadera y rodilla estables',                    accent: '#F59E0B' },
            shoulders: { label: 'Hombro + trapecio',     short: 'Hombro',  sub: 'Deltoides y músculos que llevan la escápula atrás y abajo',      accent: '#8B5CF6' },
            posture:   { label: 'Postura + core (casa)', short: 'Postura', sub: 'En casa: esterilla, pared, toalla, banda y kettlebell · luego caminata o cardio',        accent: '#14B8A6' },
            rest:      { label: 'Descanso',              short: 'Desc',    sub: 'Recuperación',                                                    accent: '#64748B' },
            // Días del programa anterior (solo para mostrar el historial)
            pull:      { label: 'Tracción (antiguo)',    short: 'Trac',    sub: 'Programa anterior', accent: '#047857', legacy: true },
            legs:      { label: 'Cadena post. (antiguo)', short: 'C.Post', sub: 'Programa anterior', accent: '#1D4ED8', legacy: true },
            mobility:  { label: 'Movilidad (antiguo)',   short: 'Movil',   sub: 'Programa anterior', accent: '#B45309', legacy: true },
            push:      { label: 'Empuje (antiguo)',      short: 'Push',    sub: 'Programa anterior', accent: '#BE123C', legacy: true },
            core:      { label: 'Core (antiguo)',        short: 'Core',    sub: 'Programa anterior', accent: '#6D28D9', legacy: true },
            light:     { label: 'Kettlebell (antiguo)',  short: 'Kettle',  sub: 'Programa anterior', accent: '#0F766E', legacy: true },
        };

        // Zonas del semáforo de dolor (0-10). wrist/knee se mantienen por compatibilidad con el historial.
        const ZONES = [
            { k: 'sternum',  label: 'Esternón',               short: 'Esternón' },
            { k: 'side',     label: 'Costado izq. (serrato)', short: 'Costado' },
            { k: 'shoulder', label: 'Hombro derecho',         short: 'Hombro' },
            { k: 'groin',    label: 'Ingle / pelvis',         short: 'Ingle' },
            { k: 'knee',     label: 'Rodilla izq. (menisco)', short: 'Rodilla' },
            { k: 'wrist',    label: 'Muñeca derecha',         short: 'Muñeca' },
        ];
        const ZONE = Object.fromEntries(ZONES.map(z => [z.k, z]));
        const emptyPain = () => Object.fromEntries(ZONES.map(z => [z.k, 0]));

        const BLOCKS = { warm: 'Calentamiento', mob: 'Movilidad torácica', post: 'Fuerza postural con banda', main: 'Entreno', core: 'Circuito core · 3 vueltas', cardio: 'Cardio', cool: 'Estiramientos', later: 'Después: caminata o gym' };
        const BLOCK_ORDER = ['warm', 'mob', 'post', 'main', 'core', 'cardio', 'cool', 'later'];
        const yt = (id) => `https://youtu.be/${id}`;
        const S = (n, extra = {}) => Array.from({ length: n }, () => ({ w: '', r: '', ...extra }));
        const T = (n, sec) => Array.from({ length: n }, () => ({ sec, done: false }));
        const W = (n, w) => Array.from({ length: n }, () => ({ w: String(w), r: '' }));

        /* Calentamientos y vuelta a la calma (comunes) */
        const WARM_TORSO = [
            { name: 'Extensión torácica en foam roller', kind: 'timer', block: 'warm', video: yt('_S0npbwGk44'), sets: T(1, 120),
              target: '2 min · 12-15 respiraciones', cue: 'Rulo en la zona dorsal media-alta, brazos cruzados abrazando los hombros, pelvis en retroversión. Respira hondo abriendo las costillas.' },
            { name: 'Rotación externa en polea o banda', kind: 'reps', block: 'warm', video: yt('wQdfeB80fqo'), sets: S(2),
              target: '2 × 15 por brazo · peso mínimo', cue: 'Codo pegado al costado a 90°. Sin dolor. Prepara el hombro para los empujes.' },
        ];
        const WARM_LEGS = [
            { name: 'Bici estática con sillín alto', kind: 'timer', block: 'warm', video: yt('deKw7ml6vsY'), sets: T(1, 360),
              target: '6 min · resistencia baja', cue: 'Sillín alto: la rodilla no se dobla en exceso arriba. Cadencia suave, sin apretar.' },
            { name: 'Movilidad de cadera 90/90', kind: 'timer', block: 'warm', video: yt('adRzu0Vz37s'), sets: T(1, 120),
              target: '2 min sin carga', cue: 'Suave, para preparar la cadera antes de abductores y aductores.' },
        ];
        // Estiramientos suaves (tensión 4-5/10, nunca dolor). Los pitidos a la mitad marcan el cambio de lado.
        const ST = (name, video, cue, extra = {}) => ({ name, kind: 'timer', block: 'cool', halfBeep: true, video, sets: T(2, 60), target: '2 × 30 s por lado', cue, ...extra });
        const PEC_STRETCH = ST('Estiramiento de pectoral en pared o marco', yt('_-uIjOogBJo'), 'Codo a 45°, tensión suave (5/10) y sin dolor en el esternón.', { zones: ['sternum'] });
        const LAT_STRETCH = ST('Estiramiento de dorsal en poste', yt('mZzqAueXuws'), 'Agarra un poste a la altura del pecho y lleva la cadera atrás y hacia fuera. El dorsal acortado es uno de los que te cierran el pecho.',
            { zones: ['side'], cond: 'Suave. Si tira del costado izquierdo, hazlo solo del lado derecho o sáltalo.' });
        const COOL_TORSO = [
            { name: 'Suspensión pasiva en barra', kind: 'timer', block: 'cool', video: yt('PORNGj-x4Ao'), sets: T(2, 30), zones: ['side', 'wrist'],
              target: '2 × 30 s', cond: 'Solo si el costado izquierdo está a 0-1/10. Si molesta, sáltala.', cue: 'Cuelga relajado, sin balancearte.' },
            PEC_STRETCH,
            LAT_STRETCH,
            ST('Estiramiento de trapecio superior y cuello', yt('3LIhdRvaUSU'), 'Sentado, inclina la oreja hacia el hombro y deja caer el hombro contrario. Sin tirar fuerte de la cabeza.'),
        ];
        const COOL_LEGS = [
            ST('Estiramiento de psoas de pie', yt('mJBhb8qNrBQ'), 'De pie en zancada corta (sin apoyar la rodilla en el suelo), mete la pelvis y empuja la cadera adelante. Rodilla de atrás algo flexionada.'),
            ST('Estiramiento de isquios tumbado con toalla', yt('65x3Gh7Qnwk'), 'Boca arriba, sube la pierna con una toalla. Rodilla casi recta, pero sin bloquearla.'),
            ST('Estiramiento de glúteo tumbado (figura 4)', yt('3lq7T6R_Gy0'), 'Boca arriba, tobillo sobre la rodilla contraria y acerca las piernas al pecho. Si molesta la rodilla operada, no fuerces el ángulo.', { zones: ['knee'] }),
            ST('Estiramiento de gemelo en pared', yt('nJNGMK7_Pj4'), 'Manos en la pared, pierna de atrás estirada y talón en el suelo. Rodilla recta pero sin empujarla hacia atrás.'),
        ];
        const DIAPHRAGM = { name: 'Respiración diafragmática tumbado', kind: 'timer', block: 'cool', video: yt('TuPaMCsnxes'), sets: T(1, 180),
            target: '3 min · 10-12 respiraciones lentas', cue: 'Abre las costillas hacia los lados. Al soltar el aire, relaja trapecios y cuello. También vale en la cama antes de dormir.' };
        const cardio = (method, target, cue) => ({ name: 'Cardio zona 2', kind: 'cardio', block: 'cardio', target, cue, cardio: { method, km: '', time: '', ppm: '', rounds: '' } });
        const CARDIO_CUE = 'Pulso constante 140-150. Nada de sprints (más de 160) mientras moleste el esternón o el costado.';

        const TEMPLATES = {
            back: [
                ...WARM_TORSO,
                { name: 'Dominadas con peso corporal', kind: 'reps', rest: 150, video: yt('UwhqxIELoug'), sets: S(3), zones: ['side', 'shoulder', 'wrist'],
                  target: '3 series · para a 2 reps del fallo', cond: 'Solo si el costado izquierdo está a 0-1/10. Si no, haz dominadas escapulares (3 × 8).',
                  alt: 'Cámbialas por dominadas escapulares 3 × 8: brazos rectos, solo bajar y juntar escápulas.',
                  cue: 'Sube sacando pecho, sin encoger los hombros hacia las orejas. Sin lastre.' },
                { name: 'Jalón al pecho', kind: 'weighted', rest: 120, range: [10, 12], inc: 2.5, video: yt('72q0tKij5uU'), zones: ['side', 'shoulder'],
                  sets: [{ label: 'Aprox', w: '25', r: '15' }, { label: 'Aprox', w: '45', r: '8' }, ...W(3, 60)],
                  target: '3 × 10-12 · 60-65 kg', alt: 'Baja a 45-50 kg y no te quedes sin aire en ninguna repetición.',
                  cue: 'Torso 15° atrás, barra a la clavícula, pausa 1-2 s juntando escápulas. Suelta el aire al tirar (sin aguantar la respiración).' },
                { name: 'Remo sentado agarre ancho', kind: 'weighted', rest: 120, range: [12, 12], inc: 2.5, video: yt('L_Rheo-rv4o'), sets: S(4), zones: ['side'],
                  target: '4 × 12', alt: 'Baja un 20-30% el peso y alarga la pausa atrás.',
                  cue: 'Codos abiertos 45-60°. Tira hacia la boca del estómago (no al ombligo) y aguanta 2 s juntando escápulas.' },
                { name: 'Face pull con cuerda', kind: 'weighted', rest: 75, range: [12, 15], inc: 2.5, video: yt('X-xCQ1gh-kA'), sets: S(3), zones: ['shoulder'],
                  target: '3 × 15', cue: 'Cuerda hacia la frente rotando hacia fuera (puños detrás de las orejas). Sustituye al pájaro en máquina con el pecho apoyado.' },
                { name: 'Curl de bíceps con respaldo o predicador', kind: 'weighted', rest: 75, range: [10, 12], inc: 1, video: yt('lXbs6as_TvA'), sets: S(3), zones: ['wrist'],
                  target: '3 × 10-12', cue: 'Espalda apoyada, sin balanceo. Muñeca recta.' },
                { name: 'Curl de muñeca', kind: 'weighted', rest: 60, range: [15, 15], inc: 1, video: yt('nUkrUUrrCLs'), sets: S(3), zones: ['wrist'],
                  target: '3 × 15 · ligero', cond: 'Opcional. Solo si la muñeca derecha está a 0-2/10.', cue: 'Antebrazo apoyado, recorrido cómodo, sin dolor.' },
                cardio('treadmill', '20-25 min · 140-150 ppm', 'Caminata inclinada o trote suave. ' + CARDIO_CUE),
                ...COOL_TORSO,
            ],
            quads: [
                ...WARM_LEGS,
                { name: 'Sentadilla isométrica en pared', kind: 'timer', rest: 90, video: yt('7imrzDWGOtk'), sets: T(3, 45), zones: ['knee'],
                  target: '3 × 40-45 s · unos 60° de flexión', alt: 'Hazla igualmente, pero más alta (menos flexión), en un ángulo sin dolor. Suele aliviar.',
                  cue: 'Un palmo por encima del ángulo recto. Rodillas mirando al segundo dedo del pie.' },
                { name: 'Extensión de cuádriceps', kind: 'weighted', rest: 90, range: [12, 15], inc: 2.5, video: yt('ndnA6yvGoqQ'), sets: S(4), zones: ['knee'],
                  target: '4 × 12-15', alt: 'Peso ligero y solo la parte alta del recorrido, con pausas de 3 s arriba.',
                  cue: 'Ajusta el rodillo para empezar a 75-80° (no doblar a tope). Sube en 2 s, aguanta 3 s arriba apretando el vasto interno, baja en 3 s.' },
                { name: 'Prensa inclinada', kind: 'weighted', rest: 150, range: [12, 12], inc: 10, video: yt('bNsrqXUIJqc'), zones: ['knee'],
                  sets: [{ label: 'Aprox', w: '60', r: '10' }, ...W(3, 100)],
                  target: '3 × 12 · 100-120 kg', alt: 'Baja a 60-80 kg y recorta aún más la bajada. Si la rodilla pasa de 4/10, sáltala.',
                  cue: 'Frena a 70-75°. Pies en la mitad alta. Bajada en 3 s. Sube SIN bloquear rodillas. Cabeza y hombros relajados.' },
                { name: 'Prensa a una pierna', kind: 'weighted', rest: 90, range: [12, 12], inc: 5, video: yt('VpHZ_ELh10Y'), sets: W(2, 30), zones: ['knee'],
                  target: '2 × 12 por pierna · 30-40 kg', alt: 'Peso mínimo o sáltala hoy.',
                  cue: 'Recorrido corto. La rodilla apunta al segundo dedo del pie (que no se meta hacia dentro).' },
                { name: 'Gemelo sentado en máquina', kind: 'weighted', rest: 60, range: [15, 15], inc: 5, video: yt('fRsvxLFYEh4'), sets: S(4),
                  target: '4 × 15', cue: 'Pausa de 2 s arriba y 2 s abajo.' },
                cardio('bike', '20 min · 140-150 ppm', 'Bici con sillín alto y tronco erguido, sin cargar peso en los codos. ' + CARDIO_CUE),
                ...COOL_LEGS,
            ],
            chest: [
                ...WARM_TORSO,
                { name: 'Press de pecho en máquina (agarre neutro)', kind: 'weighted', rest: 120, range: [10, 12], inc: 2.5, video: yt('d-gwsl5BlMQ'), zones: ['sternum', 'side', 'shoulder'],
                  sets: [{ label: 'Aprox', w: '10', r: '15' }, { label: 'Aprox', w: '17.5', r: '8' }, ...W(3, 25)],
                  target: '3 × 10-12 · 25-27,5 kg por lado', alt: 'Baja a 17,5-20 kg por lado y recorta más el recorrido.',
                  cue: 'Frena 2-3 cm antes del tope. Los codos nunca pasan por detrás de la línea del tronco.' },
                { name: 'Press con mancuernas en el suelo (neutro)', kind: 'weighted', rest: 120, range: [10, 12], inc: 2, video: yt('aHZuTZBrRAs'), sets: W(3, 16), zones: ['sternum', 'side', 'wrist'],
                  target: '3 × 10-12 · 16-20 kg por mano', alt: 'Baja a 10-12 kg por mano.',
                  cue: 'Tumbado en el suelo con agarre neutro: el suelo hace de tope y protege el esternón. Sustituye para siempre a las aperturas.' },
                { name: 'Band pull-apart o face pull', kind: 'reps', rest: 45, video: yt('5OvpIHIaWDA'), sets: S(3),
                  target: '3 × 15 suaves', cue: 'Intercálalo entre series para mantener las escápulas activas en el día de empuje.' },
                { name: 'Tríceps en polea alta (cuerda o V)', kind: 'weighted', rest: 75, range: [12, 12], inc: 2.5, video: yt('uZg6VtRhwQY'), sets: S(3), zones: ['wrist'],
                  target: '3 × 12', cue: 'Hombros fijos atrás y abajo. Solo se mueve el antebrazo.' },
                { name: 'Press francés con mancuernas en el suelo', kind: 'weighted', rest: 75, range: [12, 12], inc: 1, video: yt('brrm--3S-b0'), sets: S(3), zones: ['wrist'],
                  target: '3 × 12 · agarre neutro', cue: 'Nada de extensiones por detrás de la nuca (arquean la espalda y estiran serrato y esternón).' },
                cardio('treadmill', '20-25 min · 140-150 ppm', CARDIO_CUE),
                ...COOL_TORSO,
            ],
            hams: [
                ...WARM_LEGS,
                { name: 'Abductores en máquina (abrir)', kind: 'weighted', rest: 75, range: [15, 15], inc: 5, video: yt('7Oa_6915l3M'), zones: ['groin'],
                  sets: [{ label: 'Cal.', w: '15', r: '15' }, { label: 'Cal.', w: '20', r: '15' }, ...S(4)],
                  target: '2 de calentamiento + 4 × 15', alt: 'Peso mínimo y tope todavía más cerrado.',
